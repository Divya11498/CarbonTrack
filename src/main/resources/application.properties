spring.application.name=carbontrack

# Automatically import .env from project root if it exists
spring.config.import=optional:file:.env[.properties]

# Database Configuration (Local PostgreSQL or Supabase Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carbontracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:${SUPABASE_DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWNhcmJvbnRyYWNrLTI1Ni1iaXQta2V5IQ==}

# AI Integration Configuration (Gemini API Key)
gemini.api.key=${GEMINI_API_KEY:}

# Google OAuth Configuration
app.google.client-id=${GOOGLE_CLIENT_ID:277685333707-sn96nc3k6op0i7t8o3dukmu4drk5nmm4.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:277685333707-sn96nc3k6op0i7t8o3dukmu4drk5nmm4.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Redis Cache (falls back to in-memory cache if Redis is unavailable locally)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms

# SMTP / Email Notifications (optional - falls back safely to logged delivery diagnostics)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@carbontrack.local}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Prevent Spring Data Redis from scanning JPA repositories at startup
spring.data.redis.repositories.enabled=false
