spring.application.name=carbontrack

# Automatically import .env from project root if it exists
spring.config.import=optional:file:.env[.properties]

# Database Configuration (Local PostgreSQL or Supabase Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carbontracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:${SUPABASE_DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWNhcmJvbnRyYWNrLTI1Ni1iaXQta2V5IQ==}

# AI Integration Configuration (Optional Gemini API Key)
gemini.api.key=${GEMINI_API_KEY:}
